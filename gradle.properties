# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 26.x needs a Java 25 toolchain and Loom refuses to set it up on an older daemon.
# Forward slashes are required even on Windows. (1.21.11 builds with Java 21 through a toolchain.)
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.2

mod_version=1.0.2
maven_group=dev.priceshare
archives_base_name=priceshare
loader_version=0.19.5

# Pick the target with -Pmc=<version>: 1.21.11, 26.1, 26.2 or 26.3. build-all.sh builds them all.
mc=26.2
